<div class="login-wrapper">
  <!-- Theme Toggle Button -->
  <button class="theme-toggle-btn" (click)="toggleDarkMode()" [title]="isDarkMode ? 'Modo Claro' : 'Modo Oscuro'">
    <i class="ti" [ngClass]="isDarkMode ? 'ti-sun' : 'ti-moon'"></i>
  </button>

  <div class="login-split-layout">
    
    <!-- Left Column: Login Form -->
    <div class="login-left">
      <div class="login-glass-card">
        <div class="brand-logo">
          <div class="logo-icon">
            <i class="ti ti-hexagon-letter-j"></i>
          </div>
          <span class="logo-text">Josidk ERP</span>
        </div>

        <h2 class="welcome-text">Bienvenido de nuevo</h2>
        <p class="subtitle">Ingresa tus credenciales para continuar</p>

        <form class="login-form">
          <div class="input-group">
            <label for="email">Correo Electrónico</label>
            <div class="input-wrapper">
              <i class="ti ti-mail"></i>
              <input type="email" id="email" placeholder="ejemplo@correo.com" autocomplete="off">
            </div>
          </div>

          <div class="input-group">
            <label for="password">Contraseña</label>
            <div class="input-wrapper">
              <i class="ti ti-lock"></i>
              <input type="password" id="password" placeholder="••••••••">
            </div>
          </div>

          <div class="form-actions">
            <label class="remember-me">
              <input type="checkbox">
              <span>Recordarme</span>
            </label>
            <a href="#" class="forgot-password">¿Olvidaste tu contraseña?</a>
          </div>

          <button type="button" class="btn-submit" (click)="login()">Iniciar Sesión</button>
        </form>
        
        <div class="register-prompt">
          ¿No tienes una cuenta? <a href="#">Regístrate aquí</a>
        </div>
      </div>
    </div>

    <!-- Right Column: Illustration -->
    <div class="login-right">
      <div class="illustration-wrapper">
        <img src="undraw_secure-login_m11a.svg" alt="Secure Login Illustration" class="login-illustration">
        <div class="illustration-text">
          <h3>Gestión Segura y Eficiente</h3>
          <p>Controla todos los aspectos de tu negocio desde un solo lugar con nuestra plataforma ERP moderna.</p>
        </div>
      </div>
    </div>

  </div>
</div>
