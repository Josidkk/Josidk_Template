<nav class="navbar">
  <div class="navbar-left">
    <button class="action-btn menu-toggle" (click)="onToggle()" aria-label="Toggle sidebar">
      <i class="ti ti-menu-2"></i>
    </button>

    <div class="search-box">
      <i class="ti ti-search search-icon"></i>
      <input
        type="text"
        class="search-input"
        placeholder="Buscar..."
        [(ngModel)]="searchQuery"
      />
    </div>
  </div>

  <div class="navbar-right">
    <button class="action-btn" (click)="toggleTheme()" [attr.aria-label]="isDark() ? 'Modo claro' : 'Modo oscuro'">
      <i class="ti" [ngClass]="isDark() ? 'ti-sun' : 'ti-moon'"></i>
    </button>

    <button class="action-btn has-notification" aria-label="Notificaciones">
      <i class="ti ti-bell"></i>
      <span class="notification-dot"></span>
    </button>

    <button class="action-btn hide-mobile" aria-label="Idioma">
      <i class="ti ti-world"></i>
    </button>

    <button class="action-btn hide-mobile" aria-label="Email">
      <i class="ti ti-mail"></i>
    </button>

    <div class="user-avatar">
      @if (user.avatarUrl) {
        <img [src]="user.avatarUrl" [alt]="user.name" class="avatar-img" />
      } @else {
        <span class="avatar-text">{{ user.initials }}</span>
      }
    </div>
  </div>
</nav>
